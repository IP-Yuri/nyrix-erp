services:
  - type: web
    name: nyrix-erp
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_SHEET_ID
        value: 1ZIZrxWkbIbcqNjkccaTlU0te6QL8Ui9iNSZlxfRwMao
      - key: DIGYLOG_BASE_URL
        value: https://api.digylog.com/api/v2/seller
      - key: DIGYLOG_REFERER
        value: https://apiseller.digylog.com
      - key: DIGYLOG_STORE_NAME
        value: Nyrix
      - key: DIGYLOG_API_TOKEN
        sync: false
